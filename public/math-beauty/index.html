<body>
<div id="app">
  <main id="stage">
    <header class="top">
      <div class="brand"><img id="logo" alt="" width="26" height="26" /><span class="wordmark">Math<span class="dot">·</span>beauty</span></div>
      <div class="top-right"><span id="modeName" class="mode-name"></span><button id="zen" class="icon" title="Zen mode (Z)" aria-label="Zen mode">⤢</button></div>
    </header>
    <div id="fcard" class="fcard" aria-live="off"><div id="formula" class="formula"></div></div>
  </main>
  <aside id="panel">
    <nav id="modes" class="chips" aria-label="Modes"></nav>
    <p id="blurb" class="blurb"></p>
    <nav id="presets" class="presets" aria-label="Presets"></nav>
    <section id="sliders" class="sliders"></section>
    <button id="more" class="more">More ▾</button>
    <div class="dock">
    <section class="controls">
      <button id="play" class="btn" title="Play / pause (Space)">❚❚ Pause</button>
      <label class="speed"><span>Speed</span><input id="speed" type="range" min="0.25" max="2" step="0.05" value="1" aria-label="Speed" /><b id="speedVal">1.00×</b></label>
    </section>
    <section class="controls">
      <button id="random" class="btn" title="Randomize (R)">Randomize</button>
      <button id="reset" class="btn ghost" title="Reset (Shift+R)">Reset</button>
      <button id="save" class="btn ghost" title="Save PNG (S)">Save PNG</button>
    </section>
    </div>
  </aside>
</div>
<div id="hint" class="hint" role="status" hidden></div>
