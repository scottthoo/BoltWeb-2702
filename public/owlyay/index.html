<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Owlyay — Turn screen time into learning time</title>
  <meta name="description" content="Owlyay is a parental tool for iPhone, iPad and Android: after a set time in YouTube, a child answers a short maths question to keep watching.">
  <link rel="icon" href="icon-512.png" type="image/png">
  <style>
    :root { color-scheme: light; }
    * { box-sizing: border-box; }
    body {
      margin: 0;
      min-height: 100vh;
      display: flex;
      align-items: center;
      justify-content: center;
      padding: 2rem 1.25rem;
      font-family: "Iowan Old Style", "Palatino Linotype", Palatino, "Times New Roman", serif;
      background: #f4eee3;
      color: #1c1915;
    }
    main {
      max-width: 28rem;
      text-align: center;
    }
    img.icon {
      width: 112px;
      height: 112px;
      border-radius: 24px;
      box-shadow: 0 8px 24px rgba(28, 25, 21, 0.16);
    }
    h1 {
      margin: 1.25rem 0 0.5rem;
      font-size: 1.75rem;
      font-weight: 700;
      letter-spacing: -0.02em;
      line-height: 1.2;
    }
    p {
      margin: 0 auto;
      font-size: 1.05rem;
      line-height: 1.55;
      color: #3a352e;
    }
    a {
      color: #5a3d16;
      text-underline-offset: 0.15em;
    }
    .links {
      margin-top: 1.5rem;
      font-size: 1rem;
    }
    footer {
      margin-top: 2.5rem;
      font-size: 0.8rem;
      color: #6b645b;
    }
  </style>
</head>
<body>
  <main>
    <img class="icon" src="icon-512.png" width="112" height="112" alt="Owlyay app icon">
    <h1>Owlyay — Turn screen time into learning time</h1>
    <p>Turn screen time into learning time. A parent sets Owlyay up on the child’s device; after a viewing time the parent chooses, the child answers one short maths question to keep watching YouTube.</p>
    <p class="links"><a href="/owlyay/privacy/">Privacy Policy</a></p>
    <footer>BOLT INTERACTIVE PLT</footer>
  </main>
</body>
</html>
