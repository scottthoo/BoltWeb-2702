<!doctype html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no" />
  <title>Ninja Math Dojo</title>
  <style>
    * { margin: 0; padding: 0; box-sizing: border-box; }
    html, body { height: 100%; overflow: hidden; background: #0b1026; }
    body {
      font-family: "Arial Rounded MT Bold", "Chalkboard SE", "Comic Sans MS", system-ui, sans-serif;
      -webkit-user-select: none; user-select: none;
      -webkit-tap-highlight-color: transparent;
    }
    #app, #app canvas { position: fixed; inset: 0; touch-action: none; }

    #hud { position: fixed; inset: 0; pointer-events: none; z-index: 5; }

    #topbar {
      position: absolute; top: 0; left: 0; right: 0;
      display: flex; align-items: flex-start; justify-content: space-between;
      padding: 14px 16px; gap: 10px;
    }
    #belt-chip {
      display: flex; align-items: center; gap: 8px;
      background: rgba(10, 14, 34, 0.65); border: 2px solid rgba(255,255,255,0.18);
      border-radius: 999px; padding: 8px 14px;
      color: #fff; font-size: 17px; font-weight: 800; white-space: nowrap;
      backdrop-filter: blur(4px);
    }
    #belt-dot {
      width: 16px; height: 16px; border-radius: 50%;
      background: #f2f2ec; border: 2px solid rgba(0,0,0,0.35);
      box-shadow: 0 0 8px rgba(255,255,255,0.35);
    }
    #question {
      flex: 1; text-align: center;
      color: #fff; font-size: clamp(30px, 6vw, 52px); font-weight: 900;
      text-shadow: 0 3px 0 rgba(0,0,0,0.45), 0 0 24px rgba(80,120,255,0.35);
      letter-spacing: 2px; padding-top: 2px;
    }
    #buttons { display: flex; gap: 8px; }
    #buttons button {
      pointer-events: auto; cursor: pointer;
      width: 48px; height: 48px; border-radius: 50%;
      border: 2px solid rgba(255,255,255,0.25);
      background: rgba(10, 14, 34, 0.65); color: #fff; font-size: 22px;
      backdrop-filter: blur(4px);
    }
    #buttons button:active { transform: scale(0.92); }

    #stars {
      position: absolute; top: 74px; left: 0; right: 0;
      text-align: center; font-size: 26px; letter-spacing: 6px;
      color: #ffd93b;
      text-shadow: 0 2px 0 rgba(0,0,0,0.55), 0 0 10px rgba(0,0,0,0.6);
    }

    #hint {
      position: absolute; bottom: 26px; left: 0; right: 0;
      text-align: center; color: #ffe9b8; font-size: clamp(17px, 3.6vw, 24px); font-weight: 800;
      text-shadow: 0 2px 0 rgba(0,0,0,0.5);
      animation: hintbob 1.6s ease-in-out infinite;
      transition: opacity 0.5s;
    }
    #hint.hidden { opacity: 0; }
    @keyframes hintbob { 0%,100% { transform: translateY(0); } 50% { transform: translateY(-7px); } }

    #banner {
      position: absolute; top: 34%; left: 0; right: 0;
      text-align: center; font-size: clamp(40px, 9vw, 76px); font-weight: 900;
      color: #ffd93b; text-shadow: 0 4px 0 rgba(0,0,0,0.5), 0 0 40px rgba(255,200,60,0.55);
      opacity: 0; transform: scale(0.3); pointer-events: none;
    }
    #banner.pop { animation: bannerpop 2.6s ease forwards; }
    @keyframes bannerpop {
      0%   { opacity: 0; transform: scale(0.3); }
      12%  { opacity: 1; transform: scale(1.15); }
      20%  { transform: scale(1.0); }
      80%  { opacity: 1; transform: scale(1.0); }
      100% { opacity: 0; transform: scale(1.1); }
    }

    #start {
      position: fixed; inset: 0; z-index: 10;
      display: flex; flex-direction: column; align-items: center; justify-content: center; gap: 18px;
      background: radial-gradient(ellipse at 50% 30%, #253368 0%, #131a3d 55%, #090d22 100%);
      transition: opacity 0.5s; text-align: center; padding: 20px;
    }
    #start.hidden { opacity: 0; pointer-events: none; }
    #start .ninja-emoji { font-size: 92px; animation: hintbob 1.4s ease-in-out infinite; }
    #start h1 {
      color: #fff; font-size: clamp(38px, 8vw, 68px); font-weight: 900;
      text-shadow: 0 4px 0 rgba(0,0,0,0.5), 0 0 40px rgba(90,130,255,0.45);
    }
    #start p { color: #cfd8ff; font-size: clamp(17px, 3.6vw, 24px); font-weight: 700; }
    #btn-start {
      pointer-events: auto; cursor: pointer; margin-top: 8px;
      font-family: inherit; font-size: clamp(26px, 5vw, 38px); font-weight: 900;
      color: #fff; letter-spacing: 3px;
      padding: 18px 58px; border-radius: 999px; border: 4px solid #ffd93b;
      background: linear-gradient(#ff5f4d, #d63a2c);
      box-shadow: 0 8px 0 #8e2318, 0 12px 30px rgba(0,0,0,0.5);
      transition: transform 0.1s;
    }
    #btn-start:active { transform: translateY(5px); box-shadow: 0 3px 0 #8e2318; }
  </style>
  <script type="module" crossorigin src="/kid-game/ninja-math-dojo/assets/index-lgt6vl-C.js"></script>
</head>
<body>
  <div id="app"></div>

  <div id="hud">
    <div id="topbar">
      <div id="belt-chip"><span id="belt-dot"></span><span id="belt-name">White Belt</span></div>
      <div id="question"></div>
      <div id="buttons">
        <button id="btn-say" title="Say it again">🔊</button>
        <button id="btn-mute" title="Sound on/off">🔈</button>
      </div>
    </div>
    <div id="stars"></div>
    <div id="banner"></div>
    <div id="hint">Tap the lantern with the right answer!</div>
  </div>

  <div id="start">
    <div class="ninja-emoji">🥷</div>
    <h1>Ninja Math Dojo</h1>
    <p>Throw ninja stars at the lantern with the right answer.<br />Earn all your karate belts!</p>
    <button id="btn-start">START!</button>
  </div>

</body>
</html>
